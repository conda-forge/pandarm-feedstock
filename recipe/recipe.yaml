schema_version: 1

context:
  name: pandarm
  version: "0.0.7.post1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d85fcc70860e5fc87577b7c820810e1011b298e0242f90d3aecc56e8d044f1ce

build:
  number: 0
  script:
    - if: unix
      then: export CMAKE_GENERATOR=Ninja
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - cmake >=3.18
    - ninja
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - nanobind >=2.0
        - numpy >=2.0
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: osx
      then: llvm-openmp
  host:
    - python
    - pip
    - if: linux or win
      then: libgomp
    - if: osx
      then: llvm-openmp
    - numpy
    - nanobind >=2.0
    - scikit-build-core >=0.10
    - setuptools-scm >=8
  run:
    - python
    - if: win
      then: vcomp14
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
    - numpy >=1.26
    - pandas >=2.2
    - scikit-learn >=1.4
    - pytables >=3.10
    - osmnx >=2.0
    - geopandas >=1.1

tests:
  - python:
      imports:
        - pandarm
        - pandarm.cyaccess
        - pandarm.loaders
      pip_check: true

about:
  license: AGPL-3.0-only
  license_file: LICENSE.txt
  summary: Python library for network analysis
  description: |
    pandarm is a Python library for network analysis that uses contraction hierarchies to calculate super-fast travel accessibility metrics and shortest paths. The numerical code is in C++.
  homepage: https://github.com/oturns/pandarm
  repository: https://github.com/oturns/pandarm
  documentation: https://oturns.github.io/pandarm

extra:
  recipe-maintainers:
    - martinfleis
    - knaaptime
    - sjsrey
    - jgaboardi
